<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecanografía Maestra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PT Sans', Verdana, sans-serif;
            color: white;
            background: url('https://static.wixstatic.com/media/11062b_a1528b08d39e4a7cbab288ee36a69304~mv2.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        header {
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 40px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo img {
            height: 90px;
        }

        nav a {
            color: white;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-decoration: none;
            padding: 8px 15px;
            margin: 0 15px;
            border-radius: 4px;
            transition: 0.3s;
        }

        nav a:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .hero {
            height: 40vh;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
        }

        .hero h2 {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .test-container {
            max-width: 800px;
            margin: 100px auto 2rem;
            padding: 2rem;
            background-color: rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .test-container h2 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 20px;
            text-align: center;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-box {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 1.2rem;
            border-radius: 8px;
            text-align: center;
            transition: transform 0.3s;
        }

        .stat-box:hover {
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00e0ff;
            text-shadow: 0 0 10px rgba(0, 224, 255, 0.3);
        }

        .stat-label {
            color: #ffffff;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .text-display {
            font-size: 1.3rem;
            line-height: 1.8;
            margin-bottom: 2rem;
            padding: 1.5rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            min-height: 120px;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        .text-display span.correct {
            color: #2ecc71;
            text-shadow: 0 0 5px rgba(46, 204, 113, 0.3);
        }

        .text-display span.incorrect {
            color: #e74c3c;
            text-decoration: underline wavy;
            text-shadow: 0 0 5px rgba(231, 76, 60, 0.3);
        }

        .text-display span.current {
            background-color: rgba(241, 196, 15, 0.3);
            padding: 0 2px;
            border-radius: 3px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { background-color: transparent; }
        }

        .input-area {
            margin-bottom: 2rem;
        }

        #typing-input {
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            border: 2px solid #00e0ff;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            transition: all 0.3s;
        }

        #typing-input:focus {
            border-color: #00e0ff;
            box-shadow: 0 0 15px rgba(0, 224, 255, 0.3);
            outline: none;
            transform: translateY(-2px);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            background-color: #00e0ff;
            color: #000;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #00b8d4;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 224, 255, 0.3);
        }

        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .difficulty-selector {
            margin-bottom: 1rem;
            text-align: center;
        }

        .difficulty-btn {
            background: transparent;
            color: white;
            border: 2px solid #00e0ff;
            padding: 0.5rem 1rem;
            margin: 0 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .difficulty-btn.active {
            background: #00e0ff;
            color: #000;
        }

        .history-container {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .history-title {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .history-list {
            list-style: none;
            padding: 0;
        }

        .history-item {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            padding: 0.8rem;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            text-align: center;
        }

        @media (max-width: 768px) {
            header {
                padding: 10px 20px;
            }

            nav a {
                margin: 0 8px;
                padding: 6px 10px;
                font-size: 14px;
            }

            .test-container {
                margin: 80px 20px 2rem;
                padding: 1.5rem;
            }

            .stat-box {
                padding: 1rem;
            }

            .text-display {
                font-size: 1.1rem;
                padding: 1rem;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="Imagenes/LOGO_PROYECTO--png.png" alt="Mecanografía Maestra Logo">
        </div>
        <nav class="nav">
            <a href="index.html">Inicio</a>
            <a href="Registro.html">Registro</a>
            <a href="inicio.html">Iniciar Sesión</a>
        </nav>
    </header>
    
    <section class="hero">
        <h2>Aprende Mecanografía con Mecanografía Maestra</h2>
    </section>

    <div class="test-container">
        <h2>Test de Velocidad de Escritura</h2>
        
        <div class="difficulty-selector">
            <button class="difficulty-btn active" data-difficulty="facil">Fácil</button>
            <button class="difficulty-btn" data-difficulty="medio">Medio</button>
            <button class="difficulty-btn" data-difficulty="dificil">Difícil</button>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="wpm">0</div>
                <div class="stat-label">Palabras por minuto</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="accuracy">100%</div>
                <div class="stat-label">Precisión</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="time">60</div>
                <div class="stat-label">Tiempo restante (s)</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="score">0</div>
                <div class="stat-label">Puntuación</div>
            </div>
        </div>

        <div class="text-display" id="text-display"></div>
        <div class="input-area">
            <input type="text" id="typing-input" disabled 
                   placeholder="Haz clic en 'Comenzar' para iniciar el test">
        </div>
        
        <div class="button-group">
            <button id="start-btn" class="btn">Comenzar</button>
            <button id="reset-btn" class="btn" disabled>Reiniciar</button>
        </div>

        <div class="history-container">
            <h3 class="history-title">Historial de intentos</h3>
            <div class="history-list" id="history-list"></div>
        </div>
    </div>

    <script>
        const textDisplay = document.getElementById('text-display');
        const typingInput = document.getElementById('typing-input');
        const startButton = document.getElementById('start-btn');
        const resetButton = document.getElementById('reset-btn');
        const wpmDisplay = document.getElementById('wpm');
        const accuracyDisplay = document.getElementById('accuracy');
        const timeDisplay = document.getElementById('time');
        const scoreDisplay = document.getElementById('score');
        const historyList = document.getElementById('history-list');
        const difficultyButtons = document.querySelectorAll('.difficulty-btn');

        let timeLeft = 60;
        let timer = null;
        let currentText = '';
        let currentIndex = 0;
        let mistakes = 0;
        let started = false;
        let score = 0;
        let currentDifficulty = 'facil';

        const texts = {
            facil: [
                "El sol brilla en el cielo azul.",
                "Los pájaros cantan en el árbol.",
                "Me gusta leer libros interesantes."
            ],
            medio: [
                "La programación es un arte que requiere práctica y dedicación constante.",
                "El desarrollo web moderno incluye HTML, CSS y JavaScript como tecnologías fundamentales.",
                "La inteligencia artificial está transformando la manera en que vivimos y trabajamos."
            ],
            dificil: [
                "La mecanografía es una habilidad esencial en la era digital, permitiendo una comunicación más eficiente y productiva en el trabajo.",
                "El aprendizaje continuo y la adaptabilidad son características fundamentales para el éxito en el mundo tecnológico actual.",
                "La optimización de algoritmos y estructuras de datos es crucial para desarrollar aplicaciones eficientes y escalables."
            ]
        };

        function initTest() {
            currentText = texts[currentDifficulty][Math.floor(Math.random() * texts[currentDifficulty].length)];
            currentIndex = 0;
            mistakes = 0;
            timeLeft = 60;
            started = true;
            score = 0;

            displayText();
            updateStats();
            typingInput.value = '';
            typingInput.disabled = false;
            typingInput.focus();
            startButton.disabled = true;
            resetButton.disabled = false;

            timer = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;
                updateStats();

                if (timeLeft <= 0) {
                    endTest();
                }
            }, 1000);
        }

        function displayText() {
            textDisplay.innerHTML = currentText.split('').map((char, index) => {
                let className = '';
                if (index < currentIndex) {
                    className = typingInput.value[index] === char ? 'correct' : 'incorrect';
                } else if (index === currentIndex) {
                    className = 'current';
                }
                return `<span class="${className}">${char}</span>`;
            }).join('');
        }

        function calculateWPM() {
            const words = typingInput.value.length / 5;
            const minutes = (60 - timeLeft) / 60;
            return Math.round(words / minutes);
        }

        function calculateAccuracy() {
            if (currentIndex === 0) return 100;
            const accuracy = ((currentIndex - mistakes) / currentIndex) * 100;
            return Math.round(accuracy);
        }

        function calculateScore() {
        }

function calculateScore() {
    const wpm = calculateWPM();
    const accuracy = calculateAccuracy();
    // Asignar un valor a la puntuación basándose en WPM y Precisión
    score = Math.round((wpm * (accuracy / 100)));
    return score;
}

function updateStats() {
    wpmDisplay.textContent = calculateWPM();
    accuracyDisplay.textContent = `${calculateAccuracy()}%`;
    scoreDisplay.textContent = calculateScore();
}

function endTest() {
    clearInterval(timer);
    started = false;
    typingInput.disabled = true;
    startButton.disabled = false;
    resetButton.disabled = false;

    // Agregar el intento al historial
    const historyItem = document.createElement('div');
    historyItem.classList.add('history-item');
    historyItem.innerHTML = `
        <span>${calculateWPM()} WPM</span>
        <span>${calculateAccuracy()}% Precisión</span>
        <span>${score} Puntuación</span>
    `;
    historyList.appendChild(historyItem);

    alert('Test finalizado. ¡Buen trabajo!');
}

typingInput.addEventListener('input', () => {
    if (!started) return;

    const inputValue = typingInput.value;
    const currentChar = currentText[currentIndex];

    if (inputValue[currentIndex] === currentChar) {
        currentIndex++;
    } else if (inputValue[inputValue.length - 1] !== currentChar) {
        mistakes++;
    }

    // Finalizar el test si el usuario termina el texto antes del tiempo
    if (currentIndex >= currentText.length) {
        endTest();
    }

    displayText();
    updateStats();
});

startButton.addEventListener('click', () => {
    initTest();
});

resetButton.addEventListener('click', () => {
    clearInterval(timer);
    started = false;
    typingInput.disabled = true;
    startButton.disabled = false;
    resetButton.disabled = true;

    currentIndex = 0;
    mistakes = 0;
    timeLeft = 60;
    score = 0;

    displayText();
    updateStats();
    textDisplay.textContent = '';
    typingInput.value = '';
});

difficultyButtons.forEach((button) => {
    button.addEventListener('click', () => {
        difficultyButtons.forEach((btn) => btn.classList.remove('active'));
        button.classList.add('active');
        currentDifficulty = button.getAttribute('data-difficulty');
    });
});
</script>
</body>
</html>
